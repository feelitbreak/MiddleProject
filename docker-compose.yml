name: 'middle_project'

services:
  weak_app:
    container_name: weak_app
    image: feelitbreak/middle_project:weak-app
    ports:
      - 8080:8080
    # No healthcheck: the injector deliberately treats an unreachable WeakApp as degraded rather
    # than fatal, so gating start-up on it would add nothing but a slower boot.
  data_injector:
    container_name: data_injector
    image: feelitbreak/middle_project:data-injector-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Kafka__BootstrapServers=kafka:29092
      - WeakApp__BaseUrl=http://weak_app:8080
      - WeakApp__ApiKey=supersecret
    ports:
      - 8082:8080
    depends_on:
      kafka:
        condition: service_healthy
      weak_app:
        condition: service_started
  data_processor:
    container_name: data_processor
    image: feelitbreak/middle_project:data-processor-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Kafka__BootstrapServers=kafka:29092
      # Local dev only — no real credentials involved.
      # The session time zone is pinned so that date_trunc buckets in UTC rather than local time.
      - Database__ConnectionString=Host=postgres;Port=5432;Database=meterdb;Username=postgres;Password=postgres;Options=-c timezone=UTC
      - Database__ApplyMigrationsOnStartup=true
      - ApiKey__Key=${PROCESSOR_API_KEY:?set it in .env - see .env.example}
    # Swagger documents the REST API here, so this port is how you exercise it. The key is what
    # defends it -- paste it into Swagger's Authorize box.
    ports:
      - 8084:8080
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
  graphql_gateway:
    container_name: graphql_gateway
    image: feelitbreak/middle_project:graphql-gateway-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Local dev only — no real credentials involved.
      # Read-only: DataProcessorService owns this schema and applies its migrations.
      # The session time zone is pinned so that date_trunc buckets in UTC rather than local time.
      - Database__ConnectionString=Host=postgres;Port=5432;Database=meterdb;Username=postgres;Password=postgres;Options=-c timezone=UTC
      - ApiKey__Key=${GRAPHQL_API_KEY:?set it in .env - see .env.example}
    # For tooling that can set X-Api-Key, plus probes and metrics. The Nitro IDE is not usable on
    # this port -- a browser navigation carries no header -- so it is served via the UI's /graphql.
    ports:
      - 8086:8080
    depends_on:
      postgres:
        condition: service_healthy
  notification_service:
    container_name: notification_service
    image: feelitbreak/middle_project:notification-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Kafka__BootstrapServers=kafka:29092
      - ApiKey__Key=${NOTIFICATION_API_KEY:?set it in .env - see .env.example}
    # Swagger for the probes. The hub monitor here cannot reach the hub -- a browser cannot set a
    # header on a WebSocket handshake -- so use /hub-monitor/ on the UI origin instead.
    ports:
      - 8088:8080
    depends_on:
      kafka:
        condition: service_healthy
    # No postgres dependency: this service reads no database. It forwards a signal and the browser
    # refetches the gateway.
  meter_readings_ui:
    container_name: meter_readings_ui
    image: feelitbreak/middle_project:meter-readings-ui
    ports:
      - 8090:8080
    environment:
      # nginx injects these server-side, so nothing about the back ends -- least of all a key --
      # is baked into the bundle at build time.
      - GRAPHQL_API_KEY=${GRAPHQL_API_KEY:?set it in .env - see .env.example}
      - NOTIFICATION_API_KEY=${NOTIFICATION_API_KEY:?set it in .env - see .env.example}
    depends_on:
      - graphql_gateway
      - notification_service
  postgres:
    container_name: postgres
    image: postgres:18-alpine
    ports:
      - 5432:5432
    environment:
      # Local dev only — no real credentials involved.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meterdb
      TZ: UTC
      PGTZ: UTC
    volumes:
      # PostgreSQL 18 keeps its data in a version-specific subdirectory, so the mount belongs at
      # /var/lib/postgresql rather than the /var/lib/postgresql/data used by earlier majors.
      # Mounting the old path leaves the volume unused and the container refuses to start.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meterdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  kafka:
    image: apache/kafka:latest
    hostname: kafka
    container_name: kafka
    ports:
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      # Listing topics only succeeds once the broker is actually accepting client connections,
      # which "the container started" does not imply.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-cluster-ui
    ports:
      - "8070:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
  watchtower:
    container_name: watchtower
    image: nickfedor/watchtower
    restart: unless-stopped
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    ports:
      - 9090:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - data_injector
      - data_processor
      - graphql_gateway
      - notification_service
  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    ports:
      - 3000:3000
    environment:
      # Local dev only — no real credentials/secrets involved.
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:
