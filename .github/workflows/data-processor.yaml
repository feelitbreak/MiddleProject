name: Data Processor Service - Build & Publish

on:
  push:
    branches:
      - main
    paths:
      - 'DataProcessorService/**'
  pull_request:
    paths:
      - 'DataProcessorService/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./DataProcessorService
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: Cache NuGet packages
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    - name: Cache SonarQube packages
      uses: actions/cache@v5
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
    - name: Install .NET tools
      run: |
        dotnet tool update --global dotnet-coverage
        dotnet tool update --global dotnet-sonarscanner
    - name: Build and Analyze
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        dotnet restore
        dotnet format DataProcessorService.slnx --verify-no-changes --verbosity diagnostic
        dotnet-sonarscanner begin \
          /k:"feelitbreak_MiddleProject_DataProcessorService" \
          /n:"Data Processor Service" \
          /o:"feelitbreak" \
          /d:sonar.token="${{ secrets.SONAR_TOKEN_DATA_PROCESSOR }}" \
          /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml \
          /d:sonar.projectBaseDir="$GITHUB_WORKSPACE/DataProcessorService" \
          /d:sonar.coverage.exclusions="src/Api/Program.cs,src/Api/Extensions/Extensions.cs,src/Api/Endpoints/**,src/Application/Behaviors/LoggingBehaviorLog.cs,src/Application/Dispatch/CqrsServiceCollectionExtensions.cs,src/Infrastructure/Configuration/DatabaseOptions.cs,src/Infrastructure/Messaging/KafkaConsumerServiceLog.cs,src/Infrastructure/Persistence/PostgresFunctions.cs,src/Infrastructure/Persistence/Migrations/**"
        dotnet build --no-restore
        dotnet-coverage collect "dotnet test --no-build --verbosity normal" -f xml -o "coverage.xml"
        dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN_DATA_PROCESSOR }}"
  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build and Push
      uses: docker/build-push-action@v7
      with:
        context: "{{defaultContext}}:DataProcessorService"
        push: true
        tags: ${{ vars.DOCKERHUB_REPOSITORY }}:data-processor-service
