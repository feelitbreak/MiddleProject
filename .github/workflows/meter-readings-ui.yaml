name: Meter Readings UI - Build & Publish

on:
  push:
    branches:
      - main
    paths:
      - 'MeterReadingsUI/**'
      - 'GraphQLGatewayService/src/Api/schema.graphql'
  pull_request:
    paths:
      - 'MeterReadingsUI/**'
      - 'GraphQLGatewayService/src/Api/schema.graphql'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./MeterReadingsUI
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: 'MeterReadingsUI/.nvmrc'
          cache: npm
          cache-dependency-path: MeterReadingsUI/package-lock.json
      - name: Install
        run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      # The generated types are committed, so a gateway schema change that nobody regenerated
      # against fails here rather than at runtime.
      - name: Verify the committed types match the gateway schema
        run: |
          npm run codegen
          git diff --exit-code -- src/graphql/generated

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: '{{defaultContext}}:MeterReadingsUI'
          push: true
          tags: ${{ vars.DOCKERHUB_REPOSITORY }}:meter-readings-ui
