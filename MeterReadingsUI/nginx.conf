worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 65;

  # Writable by the unprivileged nginx user; the image's defaults under /var/cache are not.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  gzip on;
  # Without gzip_proxied, nginx compresses its own files but never an upstream's, which left every
  # GraphQL response uncompressed.
  gzip_proxied any;
  # HotChocolate answers with the GraphQL-over-HTTP media type, not application/json.
  gzip_types
    text/css
    application/javascript
    text/javascript
    application/json
    application/graphql-response+json
    image/svg+xml;
  gzip_min_length 1024;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server_tokens off;

  # The server block is a template rendered at start-up, so rotating the API keys is a restart
  # rather than an image rebuild. A wildcard include matching nothing is not an error, so a failed
  # render degrades to "nothing listens" rather than to a proxy with no key.
  include /tmp/nginx-conf/*.conf;
}
