sonar.projectKey=feelitbreak_MiddleProject_MeterReadingsUI
sonar.projectName=Meter Readings UI
sonar.organization=feelitbreak

sonar.sources=src
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/graphql/generated/**
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# ESLint warnings arrive as external issues, so deprecations are visible to reviewers in Sonar
# without the lint step failing the build.
sonar.eslint.reportPaths=eslint-report.json
sonar.typescript.tsconfigPath=tsconfig.app.json
sonar.sourceEncoding=UTF-8

# Generated from the gateway's schema and committed; Sonar has no say over its shape.
sonar.coverage.exclusions=src/main.tsx,src/graphql/generated/**,src/config.ts
